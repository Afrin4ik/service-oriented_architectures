syntax = "proto3";

package flight.v1;

import "google/protobuf/timestamp.proto";

// Every method requires x-api-key metadata. Missing/invalid key: UNAUTHENTICATED.
// Invalid UUID, IATA, date or quantity: INVALID_ARGUMENT.
service FlightService {
  rpc SearchFlights(SearchFlightsRequest) returns (SearchFlightsResponse);
  // Unknown flight: NOT_FOUND.
  rpc GetFlight(GetFlightRequest) returns (Flight);
  // Atomic, idempotent by booking_id. Different payload for same ID: ALREADY_EXISTS.
  // Insufficient seats: RESOURCE_EXHAUSTED. Inactive flight, changed price,
  // or previously released booking_id: FAILED_PRECONDITION. DB outage: UNAVAILABLE.
  rpc ReserveSeats(ReserveSeatsRequest) returns (SeatReservation);
  // Idempotent, including unknown booking_id: persists a cancellation fence so
  // that a delayed ReserveSeats cannot resurrect a cancelled operation.
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
  // Unknown flight: NOT_FOUND. Capacity below reserved count: FAILED_PRECONDITION.
  rpc UpdateFlight(UpdateFlightRequest) returns (Flight);
}

enum FlightStatus {
  FLIGHT_STATUS_UNSPECIFIED = 0;
  SCHEDULED = 1;
  DEPARTED = 2;
  CANCELLED = 3;
  COMPLETED = 4;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  RELEASED = 2;
  EXPIRED = 3;
}

message Flight {
  string id = 1;
  string flight_number = 2;
  string airline = 3;
  string origin = 4;
  string destination = 5;
  google.protobuf.Timestamp departure_time = 6;
  google.protobuf.Timestamp arrival_time = 7;
  int32 total_seats = 8;
  int32 available_seats = 9;
  // Integer kopecks, RUB. Never binary floating point.
  int64 price_minor = 10;
  FlightStatus status = 11;
}

message SeatReservation {
  string id = 1;
  string flight_id = 2;
  string booking_id = 3;
  int32 seat_count = 4;
  ReservationStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  int64 unit_price_minor = 7;
}

message SearchFlightsRequest {
  string origin = 1;
  string destination = 2;
  // ISO 8601 calendar date in UTC, YYYY-MM-DD. Empty means any date.
  string date = 3;
}
message SearchFlightsResponse { repeated Flight flights = 1; }
message GetFlightRequest { string id = 1; }
message ReserveSeatsRequest {
  string flight_id = 1;
  int32 seat_count = 2;
  string booking_id = 3;
  // Optimistic price check against the GetFlight snapshot, under the row lock.
  optional int64 expected_price_minor = 4;
}
message ReleaseReservationRequest { string booking_id = 1; }
message ReleaseReservationResponse {
  bool released = 1;
  // Absent if a fence was created for an unknown booking.
  SeatReservation reservation = 2;
}
message UpdateFlightRequest {
  string flight_id = 1;
  optional int64 price_minor = 2;
  optional int32 total_seats = 3;
  optional FlightStatus status = 4;
}
